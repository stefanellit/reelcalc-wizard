<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Line-page review checks</title>

<body><nav><button id="run">Run behavior checks</button><select id="width" aria-label="Preview width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select><button data-section="use-this-line">Calculator</button><button data-section="rcResults">Results</button><button data-section="diameter-chart">Chart</button><button data-section="compare-lines">Comparison</button><button data-section="examples-title">Example plans</button><button id="measure">Measure layout</button><button id="reload">Reload saved setup</button></nav>
<button id="plan-links">Example setup links</button><pre id="report">Loading...</pre><div id="frame-wrap"><iframe title="PowerPro responsive preview" src="../../examples/line-pages/powerpro-spectra.html?v=gold-audit"></iframe></div>
<script>
const frame = document.querySelector('iframe');
const report = document.getElementById('report');
let lastChecks = [];
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
async function ready() { for (let i=0;i<100;i++) { if(frame.contentWindow.ReelCalcLinePage) return; await sleep(100); } throw Error('Tool failed to load'); }
const change = (id,value) => { const e=frame.contentDocument.getElementById(id); e.value=String(value); e.dispatchEvent(new frame.contentWindow.Event(e.tagName==='INPUT'?'input':'change',{bubbles:true})); };
function measure() {
  const d=frame.contentDocument, w=frame.contentWindow;
  const visible=e=>e.getClientRects().length&&!e.closest('[hidden]');
  const over=[...d.querySelectorAll('main *, main')].filter(visible).filter(e=>{ const r=e.getBoundingClientRect(); return r.right>d.documentElement.clientWidth+1||r.left < -1; }).map(e=>e.id||e.tagName+'.'+e.className);
  const fields=[...d.querySelectorAll('input,select,button,a,summary')].filter(visible);
  const overlaps=[];
  for(let i=0;i<fields.length;i++)for(let j=i+1;j<fields.length;j++){ const a=fields[i].getBoundingClientRect(),b=fields[j].getBoundingClientRect(); if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>1&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>1)overlaps.push([fields[i].id,fields[j].id]); }
  const image=d.querySelector('.rc-product-figure img');
  return {width:w.innerWidth,pageWidth:d.documentElement.scrollWidth,overflow:over,controlOverlaps:overlaps,imageLoaded:!!(image.complete&&image.naturalWidth),visibleControls:fields.length};
}
document.getElementById('width').onchange=e=>{frame.style.width=e.target.value+'px';frame.style.zoom=Number(e.target.value)>700?'0.5':'1';requestAnimationFrame(()=>report.textContent=JSON.stringify({layout:measure()},null,2));};
document.getElementById('measure').onclick=()=>report.textContent=JSON.stringify({checks:lastChecks,layout:measure()},null,2);
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>frame.contentDocument.getElementById(b.dataset.section).scrollIntoView({block:'start'}));
document.getElementById('plan-links').onclick=()=>frame.contentDocument.querySelector('.rc-example-actions').scrollIntoView({block:'center'});
document.getElementById('reload').onclick=async()=>{const before=frame.contentWindow.location.href;frame.src=before;await sleep(200);await ready();report.textContent=JSON.stringify({url:before,backing:frame.contentDocument.getElementById('rcBackingLb').value,result:frame.contentDocument.getElementById('rcResults').textContent,layout:measure()},null,2);};

    check('Manual rating saved without a catalog reel in URL',new URL(w.location.href).searchParams.get('reelSource')==='manual'&&!new URL(w.location.href).searchParams.has('reel'));
    d.querySelector('[data-reel-source="database"]').click();
    check('Returning to database restores catalog calculation and link',api.state.lastResult.reel.id==='shimano-slx-a-150-6-3-rh-slx150a'&&new URL(get('rcWizardCta').href).searchParams.get('reel')===api.state.selectedReel.id&&!new URL(w.location.href).searchParams.has('ratingCapacity'));
    d.querySelector('[data-reel-source="manual"]').click();
    const layouts=[];
    for(const group of d.querySelectorAll('[data-diameter-group]'))group.open=true;
    for(const width of [320,390,768,1280]) {frame.style.width=width+'px';await sleep(100);const layout=measure();layouts.push(layout);check('Layout bounds at '+width,!layout.overflow.length&&!layout.controlOverlaps.length&&layout.imageLoaded,layout);}
    frame.style.width='390px';document.getElementById('width').value='390';
    frame.contentWindow.scrollTo(0,0);
    const savedUrl=w.location.href,savedBacking=api.state.lastResult.backingYards;
    frame.src=savedUrl;await sleep(300);await ready();
    const reloaded=frame.contentWindow.ReelCalcLinePage;
    check('Manual share URL restores rating, mode and backing result',reloaded.state.reelSource==='manual'&&reloaded.state.lastResult&&Math.abs(reloaded.state.lastResult.backingYards-savedBacking)<1e-8&&!reloaded.state.selectedReel);
    report.textContent=JSON.stringify({passed:lastChecks.every(c=>c.pass),count:lastChecks.length,checks:lastChecks},null,2);
  } catch(error) {check('Audit runner completed',false,error.message);}
};
frame.onload=async()=>{await ready();report.textContent=JSON.stringify({ready:true,layout:measure()},null,2);};
</script></body></html>
