<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Capacity warning layout checks</title><style>
body{margin:0;padding:16px;font:14px Arial;background:#eceff0;color:#222}h1{font-size:22px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}button{padding:8px;cursor:pointer}#frames{display:flex;gap:16px;align-items:start;flex-wrap:wrap}section{max-width:100%}h2{font-size:16px}iframe{background:white;border:1px solid #999;max-width:100%;height:760px}pre{white-space:pre-wrap;font-size:12px}
</style></head><body><h1>Capacity warning checks</h1><nav><button id="mobile">390px</button><button id="desktop">1024px</button><button id="check">Check and show warnings</button></nav><pre id="status">Loading previews...</pre><main id="frames"></main><script>
const targets = [
  ["Wizard", "../../index.html?reel=daiwa-bg-lt-3000d-xh&line=seaguar-tatsu-fluorocarbon-10&lb=10"],
  ["Line page", "../../previews/line-pages/seaguar-tatsu-hosted.html?reel=daiwa-bg-lt-3000d-xh&line=seaguar-tatsu-fluorocarbon-10&lb=10&mode=capacity&backingLine=none"],
  ["Reel page calculator", "reel-fixture.html?mode=capacity"],
  ["Comparison", "../../examples/reel-comparison.html?reel1=daiwa-bg-lt-3000d-xh&reel2=penn-fierce-iv-8000-frciv8000-474&mainLine=seaguar-tatsu-fluorocarbon-10&backing=off"]
];
for (const [name, url] of targets) {
  const section = document.createElement("section"), title = document.createElement("h2"), frame = document.createElement("iframe");
  title.textContent = name; frame.title = name; frame.width = "390"; frame.src = url;
  section.append(title, frame); document.querySelector("#frames").append(section);
}
function warnings(doc) {
  return [...doc.querySelectorAll("[data-capacity-rating-warning]"), ...Array.from(doc.querySelectorAll("[data-reelcalc-calculator]")).flatMap(m => Array.from(m.shadowRoot?.querySelectorAll("[data-capacity-rating-warning]") || []))];
}
document.querySelector("#check").onclick = () => {
  const results = Array.from(document.querySelectorAll("iframe")).map(frame => {
    const doc = frame.contentDocument, notices = warnings(doc), width = doc.documentElement.clientWidth;
    notices[0]?.scrollIntoView({block:"center"});
    return { page: frame.title, width, warningCount: notices.length, overflow: doc.documentElement.scrollWidth > width + 1,
      noticesFit: notices.every(n => { const r = n.getBoundingClientRect(); return r.width > 0 && r.left >= 0 && r.right <= width + 1 && n.scrollWidth <= n.clientWidth + 1; }) };
  });
  document.querySelector("#status").textContent = JSON.stringify(results, null, 2);
};
for (const [id, width] of [["mobile",390],["desktop",1024]]) document.getElementById(id).onclick = () => document.querySelectorAll("iframe").forEach(f => f.width = String(width));
</script></body></html>
